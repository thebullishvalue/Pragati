# Pragyam — base Streamlit theme.
#
# ui/theme.css (via ui.theme.inject_css) is the source of truth for almost
# everything visual and already overrides the widgets it names explicitly.
# This file exists for the handful of NATIVE controls that read Streamlit's
# own theme system directly rather than plain CSS (radio/checkbox dots,
# toggle switches, links, code blocks) — without it those fall back to
# Streamlit's stock red (#FF4B4B), which clashes with the accent-blue /
# semantic-colour system everywhere else. Before this file existed, that red
# was the only unclaimed colour left in the application.
#
# ── WHY THERE IS EXACTLY ONE SECTION ─────────────────────────────────────
# This file used to declare [theme.light] and [theme.dark] as well, on the
# reasoning that mirroring both of ui/theme.css's ramps meant whichever one
# Streamlit resolved would still be one of ours. That reasoning was wrong,
# and the way it was wrong is worth stating so it is not re-introduced.
#
# Read from the shipped 1.51 bundle (`createCustomThemes`): if EITHER a light
# or a dark section is present, Streamlit builds three themes — Light, Dark,
# and a third named "Custom Theme Auto" defined as
#
#     getSystemThemePreference() === "dark" ? dark : light
#
# and makes that third one active. `base` does not pin anything; it only
# supplies fallbacks for keys a section leaves unset. So declaring both
# sections handed the native-widget theme to THE VIEWER'S OPERATING SYSTEM,
# while this app's own appearance comes from its Slate/Paper toggle in
# session state. The two agree only by coincidence — on a developer machine
# whose OS happens to match the app's default, which is exactly the machine
# where the mismatch cannot be seen. A viewer on a light OS got pale native
# controls in the graphite rail; a viewer on a dark OS who switched the app
# to Paper got black selects on white. Streamlit even registers a
# `matchMedia("(prefers-color-scheme: dark)")` listener, so it could flip
# mid-session. Hosting multiplies this: every viewer brings their own OS.
#
# With ONE section the same code takes the other branch — a single "Custom
# Theme", set active for every viewer regardless of OS — and `addThemes(...,
# {keepPresetThemes: false})` drops Streamlit's own Light/Dark/Auto entries
# from the appearance menu, so a viewer cannot select a mismatching native
# theme either. The native layer is now a known, fixed state.
#
# That fixed state is DARK, to agree with APPEARANCES[0] in app.py (Slate is
# the first-run default). Paper is reached only through the app's toggle, and
# every native control it touches is claimed in CSS by the reclaim block in
# ui.theme.LIGHT_TOKENS. If you add a widget that paints itself from
# Streamlit's theme rather than from a class, claim it there — do not add a
# section back here.
[theme]
base = "dark"
primaryColor = "#4C7DF0"
backgroundColor = "#0A0C10"
secondaryBackgroundColor = "#0F1217"
textColor = "#E6EAF1"
