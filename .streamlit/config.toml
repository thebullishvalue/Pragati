# Pragyam — base Streamlit theme.
#
# ui/theme.css (via ui.theme.inject_css) is the source of truth for almost
# everything visual and already overrides the widgets it names explicitly.
# This file exists for the handful of NATIVE controls that read Streamlit's
# own theme system directly rather than plain CSS (radio/checkbox dots,
# toggle switches, links, code blocks) — without it those fall back to
# Streamlit's stock red (#FF4B4B), which clashes with the accent-blue /
# semantic-colour system everywhere else. Before this file existed, that red
# was the only unclaimed colour left in the application.
#
# BASE IS DARK, because Slate is the default appearance (see APPEARANCES in
# app.py — first-in-tuple is the first-run default). The two must agree: a base
# that disagrees with the default ships light text on a light ground, or the
# reverse, on FIRST LOAD, which is the worst case to get wrong.
#
# Both variants are declared. [theme.light] and [theme.dark] mirror the two
# token ramps in ui/theme.css exactly, so whichever one Streamlit resolves for
# its native widgets is one of OUR two appearances rather than stock Streamlit
# — a mismatch then means "wrong one of ours", never "unstyled".
#
# THE RESIDUAL LIMITATION, stated because it cannot be fixed here: this file is
# STATIC. It cannot follow the in-app Slate/Paper toggle, which lives in
# session state and swaps CSS tokens at render time. Anything Streamlit themes
# natively therefore tracks Streamlit's own resolution, not the app's toggle.
# The durable fix is to override those controls in theme.css so this file stops
# mattering — the reclaiming rules in LIGHT_TOKENS are the pattern.
[theme]
base = "dark"
primaryColor = "#4C7DF0"
backgroundColor = "#0A0C10"
secondaryBackgroundColor = "#0F1217"
textColor = "#E6EAF1"

# Slate — mirrors the canonical dark :root ramp in ui/theme.css.
[theme.dark]
primaryColor = "#4C7DF0"
backgroundColor = "#0A0C10"
secondaryBackgroundColor = "#0F1217"
textColor = "#E6EAF1"

# Paper — mirrors the LIGHT_TOKENS ramp in ui/theme.py.
[theme.light]
primaryColor = "#2B5FD9"
backgroundColor = "#F4F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#141920"
